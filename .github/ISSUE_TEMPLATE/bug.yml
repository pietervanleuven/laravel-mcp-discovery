name: Bug Report
description: Report an Issue or Bug with the Package
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: How to reproduce the bug
      description: Include your `config/mcp-discovery.php`, the relevant `routes/ai.php` lines and the server class.
    validations:
      required: true
  - type: textarea
    id: list-output
    attributes:
      label: Output of `php artisan mcp-discovery:list --json`
      render: json
  - type: input
    id: package-version
    attributes:
      label: Package Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: laravel-mcp-version
    attributes:
      label: laravel/mcp Version
      placeholder: 1.0.1
    validations:
      required: true
  - type: input
    id: laravel-version
    attributes:
      label: Laravel Version
      placeholder: 13.0.0
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP Version
      placeholder: 8.4.0
    validations:
      required: true
